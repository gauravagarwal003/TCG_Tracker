            <span class="navbar-brand">

            </button>

                <ul class="navbar-nav">

                           href="transactions.html">Transactions</a>
                    </li>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <div id="userInfo" style="display:none;" class="d-flex align-items-center gap-2">
                            <small id="userEmail" class="text-muted"></small>
                            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-sign-out-alt me-1"></i>Logout
                            </button>
                        </div>

    <div class="container-fluid px-2 px-md-3 px-lg-4 mt-3">
        

        
<!-- Summary Stat Cards -->
<div class="row mb-4 g-3">
    <div class="col-12 col-sm-4">
        <div class="card h-100 stat-card">
            <div class="card-body text-center">
                <div class="stat-label">Current Value</div>
                <div class="stat-value text-success" id="stat-total-value">—</div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-4">
        <div class="card h-100 stat-card">
            <div class="card-body text-center">
                <div class="stat-label">Cost Basis</div>
                <div class="stat-value" style="color:#ef4444" id="stat-cost-basis">—</div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-4">
        <div class="card h-100 stat-card">
            <div class="card-body text-center">
                <div class="stat-label">Return %</div>
                <div class="stat-value" id="stat-return-pct">—</div>
            </div>
        </div>
    </div>
</div>

<!-- Portfolio Chart -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="d-flex align-items-center">
                    <h5 class="card-title mb-0"><i class="fas fa-chart-line me-2 text-success"></i>Portfolio Value History</h5>
                    <span id="timeframe-performance" class="small ms-2 fw-medium"></span>
                </div>
                <div class="btn-group btn-group-sm" role="group" id="timeframeButtons">
                    <button type="button" class="btn btn-outline-secondary" data-tf="1M">1M</button>
                    <button type="button" class="btn btn-outline-secondary" data-tf="3M">3M</button>
                    <button type="button" class="btn btn-outline-secondary" data-tf="6M">6M</button>
                    <button type="button" class="btn btn-outline-secondary" data-tf="1Y">1Y</button>
                    <button type="button" class="btn btn-outline-secondary" data-tf="YTD">YTD</button>
                    <button type="button" class="btn btn-outline-secondary active" data-tf="ALL">ALL</button>
                </div>
            </div>
            <div class="card-body">
                <div id="portfolioChart" style="height: 400px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Asset Allocation Donut Chart -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h5 class="card-title mb-0"><i class="fas fa-chart-pie me-2 text-info"></i>Asset Allocation</h5>
                <div class="btn-group btn-group-sm" role="group" id="allocationToggle">
                    <button type="button" class="btn btn-outline-secondary active" id="allocByFranchise">By Franchise</button>
                    <button type="button" class="btn btn-outline-secondary" id="allocByType">By Product Type</button>
                </div>
            </div>
            <div class="card-body">
                <div id="allocationChart" style="height: 350px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Current Holdings Table -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0"><i class="fas fa-boxes-stacked me-2 text-primary"></i>Current Holdings</h5>
                <span class="badge bg-success" id="holdings-count">...</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th style="width: 50px;" class="no-sort"></th>
                                <th>Product Name</th>
                                <th class="text-end">Qty</th>
                                <th class="text-end">Avg Buy</th>
                                <th class="text-end">Latest Price</th>
                                <th class="text-end">Gain %</th>
                                <th class="text-end">1-Week Change</th>
                                <th class="text-end">Total Value</th>
                            </tr>
                        </thead>
                        <tbody id="holdings-body">
                            <tr><td colspan="8" class="text-center py-4 text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="dashboard.js?v=1775186000"></script>

<script src="static/js/table-init.js"></script>

</body>
</html>
