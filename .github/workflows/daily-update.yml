name: Daily Price Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  # push trigger removed to avoid running daily price update on transaction edits

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        sudo apt-get install -y p7zip-full
    
    - name: Pull latest changes
      run: git pull --rebase origin main || true
    
    - name: Pre-flight data integrity check
      run: |
        python - <<'PY'
        from engine import load_transactions, validate_inventory, validate_price_coverage, today_pst
        from datetime import timedelta

        tx = load_transactions()
        is_valid, msg = validate_inventory(tx)
        if not is_valid:
            print(f"ERROR: Inventory validation failed: {msg}")
            exit(1)

        # Pre-flight runs before today's price fetch: verify complete coverage up through yesterday
        yesterday = (today_pst() - timedelta(days=1)).strftime("%Y-%m-%d")
        valid, missing_owned, missing_tx = validate_price_coverage(tx, as_of_date=yesterday)

        if missing_owned:
            print(f"ERROR: {len(missing_owned)} missing daily prices in owned ranges through {yesterday}: {missing_owned[:5]}")
            exit(1)

        if missing_tx:
            print(f"ERROR: {len(missing_tx)} missing transaction prices through {yesterday}: {missing_tx[:5]}")
            exit(1)

        print(f"Pre-flight verified: {len(tx)} transactions, 0 inventory errors, 100% price coverage through {yesterday}.")
        PY

    - name: Run daily update
      run: |
        if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
          echo "Firebase credentials detected: running Firestore-backed price update"
          python daily_run.py --firebase-union
        else
          echo "No Firebase credentials: running legacy local mode"
          python daily_run.py
        fi

    - name: Post-update data integrity check
      run: |
        python - <<'PY'
        from engine import load_transactions, validate_price_coverage, today_pst

        tx = load_transactions()
        td = today_pst().strftime("%Y-%m-%d")
        valid, missing_owned, missing_tx = validate_price_coverage(tx, as_of_date=td)

        if missing_owned:
            print(f"ERROR: {len(missing_owned)} missing daily prices in owned ranges after update: {missing_owned[:5]}")
            exit(1)

        if missing_tx:
            print(f"ERROR: {len(missing_tx)} missing transaction prices after update: {missing_tx[:5]}")
            exit(1)

        print(f"Post-update verified: {len(tx)} transactions, 100% price coverage through {td}.")
        PY

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git diff --staged --quiet || git commit -m "Daily price update $(date -u +'%Y-%m-%d') [skip ci]"
        git push origin main || {
          echo "Push failed, retrying with rebase..."
          git pull --rebase -X ours origin main
          git push origin main
        }
