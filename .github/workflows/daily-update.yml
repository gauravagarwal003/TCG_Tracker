name: Daily Price Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  # push trigger removed to avoid running daily price update on transaction edits

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        sudo apt-get install -y p7zip-full
    
    - name: Pull latest changes
      run: git pull --rebase origin main || true
    
    - name: Pre-flight data integrity check
      run: |
        python - <<'PY'
        from engine import (
            load_transactions, validate_inventory, normalize_transactions_for_pricing,
            get_owned_date_ranges, load_prices, parse_date, today_pst, _product_key
        )
        from datetime import timedelta

        tx = load_transactions()
        is_valid, msg = validate_inventory(tx)
        if not is_valid:
            print(f"ERROR: Inventory validation failed: {msg}")
            exit(1)

        norm_tx = normalize_transactions_for_pricing(tx)
        owned = get_owned_date_ranges(norm_tx)
        td = today_pst().strftime("%Y-%m-%d")

        missing_owned = []
        for key, ranges in owned.items():
            cat, gid, pid = key
            prices = load_prices(cat, gid, pid)
            for r_start, r_end in ranges:
                eff_end = min(r_end, td)
                cur = parse_date(r_start)
                end = parse_date(eff_end)
                while cur <= end:
                    d_str = cur.strftime("%Y-%m-%d")
                    if d_str not in prices or prices[d_str] is None or prices[d_str] <= 0:
                        missing_owned.append((key, d_str))
                    cur += timedelta(days=1)

        if missing_owned:
            print(f"ERROR: {len(missing_owned)} missing daily prices in owned ranges: {missing_owned[:5]}")
            exit(1)

        missing_tx = []
        for txn in norm_tx:
            d = txn["date_received"]
            for item in txn.get("items", []) + txn.get("items_in", []) + txn.get("items_out", []):
                cat, gid, pid = _product_key(item)
                prices = load_prices(cat, gid, pid)
                p = prices.get(d)
                if p is None or p <= 0:
                    missing_tx.append((txn["id"], d, cat, gid, pid))

        if missing_tx:
            print(f"ERROR: {len(missing_tx)} missing transaction prices: {missing_tx[:5]}")
            exit(1)

        print(f"Pre-flight verified: {len(tx)} transactions, 0 inventory errors, 100% price coverage.")
        PY


    - name: Run daily update
      run: |
        if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
          echo "Firebase credentials detected: running Firestore-backed price update"
          python daily_run.py --firebase-union
        else
          echo "No Firebase credentials: running legacy local mode"
          python daily_run.py
        fi

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git diff --staged --quiet || git commit -m "Daily price update $(date -u +'%Y-%m-%d') [skip ci]"
        git push origin main || {
          echo "Push failed, retrying with rebase..."
          git pull --rebase -X ours origin main
          git push origin main
        }
